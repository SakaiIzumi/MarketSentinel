
name: Build Market Sentinel APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle Wrapper if missing
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            curl -fsSL \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip \
              -o /tmp/gradle-8.9-bin.zip
            unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: market-sentinel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
