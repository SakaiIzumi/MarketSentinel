name: Build Market Sentinel APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK_ROOT"
          echo "SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          # 接受 SDK 许可；忽略 yes 因管道提前关闭产生的退出状态
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses
          set -o pipefail

          # 验证 SDK 许可状态
          "$SDKMANAGER" --licenses </dev/null

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle-8.9-bin.zip

          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp

          /tmp/gradle-8.9/bin/gradle --version

      - name: Verify project files
        shell: bash
        run: |
          set -e

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle or settings.gradle.kts not found in repository root"
            exit 1
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "::error::app/build.gradle or app/build.gradle.kts not found"
            exit 1
          fi

          echo "Project files verified."

      - name: Configure optional stable APK signing
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ] && [ -n "${SIGNING_STORE_PASSWORD:-}" ] && [ -n "${SIGNING_KEY_ALIAS:-}" ] && [ -n "${SIGNING_KEY_PASSWORD:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/market-sentinel-signing.jks"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            {
              echo "ANDROID_SIGNING_STORE_FILE=$KEYSTORE_PATH"
              echo "ANDROID_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
              echo "ANDROID_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
              echo "ANDROID_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Stable signing keystore configured."
          else
            echo "::warning::Signing secrets are missing. This APK uses the runner's debug key and may not update-install over an APK signed by a different runner."
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK was not generated: $APK_PATH"
            find app/build/outputs/apk -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: market-sentinel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14